name: sketch-images
description: >-
  Desktop image insertion, editing, undo, and SQLite reopen. Before running, copy
  resource/images/app_logo.png to /tmp/day-sketch-image-fixture.png. The asymmetric
  sunrise must remain upright in the first screenshot. No external source file is
  needed after insertion; the exported drawing contains its original bytes.
flow:
  - wait_for: { id: canvas }
  - menu: { key: menu_new }
  - menu: { key: tool_image, path: [menu_insert] }
  - assert_presented: {}
  - respond: { dismiss: true }
  - assert_text: { id: sk-count, key: status_count, args: { n: 0 } }
  - menu: { key: tool_image, path: [menu_insert] }
  - assert_presented: {}
  - respond: { path: /tmp/day-sketch-image-fixture.png }
  - wait_for: { id: insp-image-op }
  - assert_text: { id: sk-count, key: status_count, args: { n: 1 } }
  - input: { id: insp-x, text: "100" }
  - submit: { id: insp-x }
  - input: { id: insp-y, text: "80" }
  - submit: { id: insp-y }
  - input: { id: insp-w, text: "200" }
  - submit: { id: insp-w }
  - input: { id: insp-h, text: "160" }
  - submit: { id: insp-h }
  - assert_text: { id: sk-frame, text: "100,80 200x160" }
  - screenshot: image-upright
  - input: { id: insp-rotation, text: "30" }
  - submit: { id: insp-rotation }
  - input: { id: insp-image-op, text: "50%" }
  - submit: { id: insp-image-op }
  - screenshot: image-transformed
  - undo: {}
  - assert_text: { id: insp-image-op, text: "100%" }
  - redo: {}
  - assert_text: { id: insp-image-op, text: "50%" }
  - menu: { key: menu_export }
  - assert_presented: {}
  - respond: { path: /tmp/day-sketch-image-roundtrip.daysketch }
  - menu: { key: menu_new }
  - assert_text: { id: sk-count, key: status_count, args: { n: 0 } }
  - menu: { key: menu_open }
  - assert_presented: {}
  - respond: { path: /tmp/day-sketch-image-roundtrip.daysketch }
  - assert_text: { id: sk-count, key: status_count, args: { n: 1 } }
  - tap: { id: canvas, at: [200, 160] }
  - wait_for: { id: insp-image-op }
  - assert_text: { id: sk-frame, text: "100,80 200x160" }
  - assert_text: { id: insp-image-op, text: "50%" }
  - screenshot: image-reopened
  # A selected file that is not an image reports an error without inserting an empty node.
  - menu: { key: tool_image, path: [menu_insert] }
  - assert_presented: {}
  - respond: { path: /tmp/day-sketch-image-roundtrip.daysketch }
  - assert_presented: {}
  - respond: { dismiss: true }
  - assert_text: { id: sk-count, key: status_count, args: { n: 1 } }
