name: sketch-images
description: >-
  Desktop image insertion, editing, undo, and SQLite reopen using the bundled
  resource/images/app_logo.png fixture. The asymmetric
  sunrise must remain upright in the first screenshot. No external source file is
  needed after insertion; the exported drawing contains its original bytes.
flow:
  - wait_for: { id: canvas }
  # A preceding walkthrough may have hidden the inspector; make this script self-contained.
  - toolbar: { item: tb_inspector, on: true, only_on: [windows-winui] }
  - menu: { key: menu_new }
  - menu: { key: tool_image, path: [menu_insert] }
  - assert_presented: {}
  - respond: { dismiss: true }
  - assert_text: { id: sk_count, key: status_count, args: { n: 0 } }
  - menu: { key: tool_image, path: [menu_insert] }
  - assert_presented: {}
  - respond: { path: "${project}/resource/images/app_logo.png" }
  - wait_for: { id: insp_image_op }
  - assert_text: { id: sk_count, key: status_count, args: { n: 1 } }
  - input: { id: insp_x, text: "100" }
  - submit: { id: insp_x }
  - input: { id: insp_y, text: "80" }
  - submit: { id: insp_y }
  - input: { id: insp_w, text: "200" }
  - submit: { id: insp_w }
  - input: { id: insp_h, text: "160" }
  - submit: { id: insp_h }
  - assert_text: { id: sk_frame, text: "100,80 200x160" }
  - screenshot: image-upright
  - input: { id: insp_rotation, text: "30" }
  - submit: { id: insp_rotation }
  - input: { id: insp_image_op, text: "50%" }
  - submit: { id: insp_image_op }
  - screenshot: image-transformed
  - undo: {}
  - assert_text: { id: insp_image_op, text: "100%" }
  - redo: {}
  - assert_text: { id: insp_image_op, text: "50%" }
  - menu: { key: menu_export }
  - assert_presented: {}
  - respond: { path: "${project}/build/day/sketch-image-roundtrip.daysketch" }
  - menu: { key: menu_new }
  - assert_text: { id: sk_count, key: status_count, args: { n: 0 } }
  - menu: { key: menu_open }
  - assert_presented: {}
  - respond: { path: "${project}/build/day/sketch-image-roundtrip.daysketch" }
  - assert_text: { id: sk_count, key: status_count, args: { n: 1 } }
  - tap: { id: canvas, at: [200, 160] }
  - wait_for: { id: insp_image_op }
  - assert_text: { id: sk_frame, text: "100,80 200x160" }
  - assert_text: { id: insp_image_op, text: "50%" }
  - screenshot: image-reopened
  # A selected file that is not an image reports an error without inserting an empty node.
  - menu: { key: tool_image, path: [menu_insert] }
  - assert_presented: {}
  - respond: { path: "${project}/build/day/sketch-image-roundtrip.daysketch" }
  - assert_presented: {}
  - respond: { dismiss: true }
  - assert_text: { id: sk_count, key: status_count, args: { n: 1 } }
