name: sketch-export
description: >-
  Export the drawing as PNG and PDF (docs/canvas.md "Exporting"), from the File menu and from the
  canvas's context menu. The export is the drawing alone, cropped to its content: no zoom, no
  selection handles. Scripted runs answer the save dialog with a temp-dir path, so the bytes are
  really written. PNG renders everywhere but WinUI; PDF only where the platform has a PDF writer
  (not ArkUI, the web or WinUI), and the item is disabled elsewhere.
flow:
  - wait_for: { id: canvas }
  - menu: { key: menu_new }
  - assert_text: { id: sk_count, key: status_count, args: { n: 0 } }
  - menu: { key: tool_rect, path: [menu_insert] }
  - wait_for: { id: insp_x }
  - input: { id: insp_x, text: "40" }
  - submit: { id: insp_x }
  - input: { id: insp_y, text: "40" }
  - submit: { id: insp_y }
  - menu: { key: tool_oval, path: [menu_insert] }
  - input: { id: insp_x, text: "200" }
  - submit: { id: insp_x }
  - input: { id: insp_y, text: "160" }
  - submit: { id: insp_y }
  - assert_text: { id: sk_count, key: status_count, args: { n: 2 } }

  - menu: { key: menu_export_png, path: [menu_file], skip_on: [windows-winui] }
  - assert_presented: { skip_on: [windows-winui] }
  - respond: { path: "sketch-export.png", skip_on: [windows-winui] }
  - assert_text: { id: sk_export_status, key: status_exported, args: { name: sketch-export.png }, skip_on: [windows-winui] }

  - context_menu: { id: canvas, item_id: sk_export_pdf, skip_on: [harmony-arkui, web-dom, windows-winui] }
  - assert_presented: { skip_on: [harmony-arkui, web-dom, windows-winui] }
  - respond: { path: "sketch-export.pdf", skip_on: [harmony-arkui, web-dom, windows-winui] }
  - assert_text: { id: sk_export_status, key: status_exported, args: { name: sketch-export.pdf }, skip_on: [harmony-arkui, web-dom, windows-winui] }
  - screenshot: export
