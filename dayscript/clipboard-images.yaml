name: sketch-clipboard-images
description: Copy and cut an image through the system clipboard; preserve editable properties.
flow:
  - wait_for: { id: canvas }
  - menu: { key: menu_new }
  - menu: { key: tool_image, path: [menu_insert] }
  - assert_presented: {}
  - respond: { path: /tmp/day-sketch-image-fixture.png }
  - wait_for: { id: insp-image-op }
  - input: { id: insp-x, text: "100" }
  - submit: { id: insp-x }
  - input: { id: insp-y, text: "80" }
  - submit: { id: insp-y }
  - input: { id: insp-w, text: "200" }
  - submit: { id: insp-w }
  - input: { id: insp-h, text: "160" }
  - submit: { id: insp-h }
  - input: { id: insp-rotation, text: "30" }
  - submit: { id: insp-rotation }
  - input: { id: insp-image-op, text: "50%" }
  - submit: { id: insp-image-op }
  - tap: { id: canvas, at: [200, 160] }
  - menu: { key: day-copy }
  - pause: 1
  - menu: { key: menu_new }
  - menu: { key: day-paste }
  - wait_for: { id: insp-image-op }
  - assert_text: { id: sk-count, key: status_count, args: { n: 1 } }
  - assert_text: { id: sk-frame, text: "116,96 200x160" }
  - assert_text: { id: insp-image-op, text: "50%" }
  - assert_text: { id: insp-rotation, text: "30" }
  - screenshot: clipboard-image-pasted
  - tap: { id: canvas, at: [216, 176] }
  - menu: { key: day-cut }
  - pause: 1
  - assert_text: { id: sk-count, key: status_count, args: { n: 0 } }
  - menu: { key: day-paste }
  - wait_for: { id: insp-image-op }
  - assert_text: { id: sk-count, key: status_count, args: { n: 1 } }
  - undo: {}
  - assert_text: { id: sk-count, key: status_count, args: { n: 0 } }
  - redo: {}
  - assert_text: { id: sk-count, key: status_count, args: { n: 1 } }
