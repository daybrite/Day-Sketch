name: sketch-clipboard-images
description: Copy and cut an image through the system clipboard; preserve editable properties.
flow:
  - wait_for: { id: canvas }
  - menu: { key: menu_new }
  - menu: { key: tool_image, path: [menu_insert] }
  - assert_presented: {}
  - respond: { path: "${project}/resource/images/app_logo.png" }
  - wait_for: { id: insp_image_op }
  - input: { id: insp_x, text: "100" }
  - submit: { id: insp_x }
  - input: { id: insp_y, text: "80" }
  - submit: { id: insp_y }
  - input: { id: insp_w, text: "200" }
  - submit: { id: insp_w }
  - input: { id: insp_h, text: "160" }
  - submit: { id: insp_h }
  - input: { id: insp_rotation, text: "30" }
  - submit: { id: insp_rotation }
  - input: { id: insp_image_op, text: "50%" }
  - submit: { id: insp_image_op }
  - tap: { id: canvas, at: [200, 160] }
  - menu: { key: day-copy }
  - pause: 1
  - menu: { key: menu_new }
  - menu: { key: day-paste }
  - wait_for: { id: insp_image_op }
  - assert_text: { id: sk_count, key: status_count, args: { n: 1 } }
  - assert_text: { id: sk_frame, text: "116,96 200x160" }
  - assert_text: { id: insp_image_op, text: "50%" }
  - assert_text: { id: insp_rotation, text: "30" }
  - screenshot: clipboard-image-pasted
  - tap: { id: canvas, at: [216, 176] }
  - menu: { key: day-cut }
  - pause: 1
  - assert_text: { id: sk_count, key: status_count, args: { n: 0 } }
  - menu: { key: day-paste }
  - wait_for: { id: insp_image_op }
  - assert_text: { id: sk_count, key: status_count, args: { n: 1 } }
  - undo: {}
  - assert_text: { id: sk_count, key: status_count, args: { n: 0 } }
  - redo: {}
  - assert_text: { id: sk_count, key: status_count, args: { n: 1 } }
