name: sketch-duplicate-drag
description: Option/Alt-drag copies in place, moves the copy, and undoes in one step.
flow:
  - wait_for: { id: canvas }
  - menu: { key: menu_new }
  - menu: { key: tool_rect, path: [menu_insert] }
  - input: { id: insp-x, text: "50" }
  - submit: { id: insp-x }
  - input: { id: insp-y, text: "50" }
  - submit: { id: insp-y }
  - drag: { id: canvas, from: [90, 80], to: [250, 180], modifiers: [alt] }
  - assert_text: { id: sk-count, key: status_count, args: { n: 2 } }
  - assert_text: { id: sk-frame, text: "210,150 96x64" }
  - screenshot: option-drag-copy
  - menu: { key: menu_undo }
  - assert_text: { id: sk-count, key: status_count, args: { n: 1 } }
  - assert_text: { id: sk-frame, text: "50,50 96x64" }
  - menu: { key: menu_redo }
  - assert_text: { id: sk-count, key: status_count, args: { n: 2 } }
  - assert_text: { id: sk-frame, text: "210,150 96x64" }
  - drag: { id: canvas, from: [250, 180], to: [300, 230] }
  - assert_text: { id: sk-count, key: status_count, args: { n: 2 } }
  - assert_text: { id: sk-frame, text: "260,200 96x64" }
