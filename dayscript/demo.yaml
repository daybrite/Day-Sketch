  - screenshot:
      name: rotation-fan
      title: { en: "A turn at a time" }
      caption: { en: "One rectangle, five times, each turned a further 36° about its own centre and let through at 55%." }
      source: src/canvas.rs

  # ---- Overlapping ovals: what translucency does to color ----
  - menu: { key: menu_new }
  - menu: { key: menu_inspector }
  - wait_for: { id: insp_bg }
  - menu: { key: tool_oval, path: [menu_insert] }
  - input: { id: insp_x, text: "40" }
  - submit: { id: insp_x }
  - input: { id: insp_y, text: "90" }
  - submit: { id: insp_y }
