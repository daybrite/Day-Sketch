name: sketch-walkthrough
description: Place, select, drag, resize, group, arrange, and undo — with the selection
  riding the history, so every undo/redo lands with the selection its unit sealed with — plus
  multi-select handles, the inspector's live fields (open from launch), and the menu-driven
  canvas zoom. The whole editor through the synthetic rail, with model-state asserts after
  every gesture; deterministic because the run starts on a fresh document (File ▸ New Drawing).
flow:
  - wait_for: { id: canvas }
  # The inspector shows by default — its fields are part of the editor from the first frame.
  - wait_for: { id: insp-x }
  # A fresh numbered document every run — the walkthrough never inherits the last run's scene.
  - menu: { key: menu_new }
  - assert_text: { id: sk-count, key: status_count, args: { n: 0 } }
  - assert_text: { id: sk-sel, key: status_none }

  # ---- Place: armed tool + tap, re-arming Select after each ----
  - tap: { id: tool-rect }
  - tap: { id: canvas, at: [40, 40] }
  - assert_text: { id: sk-count, key: status_count, args: { n: 1 } }
  - assert_text: { id: sk-sel, key: status_selected, args: { ids: "1" } }
  - assert_text: { id: sk-frame, text: "40,40 96x64" }
  - tap: { id: tool-oval }
  - tap: { id: canvas, at: [200, 160] }
  - assert_text: { id: sk-count, key: status_count, args: { n: 2 } }
  - assert_text: { id: sk-frame, text: "200,160 96x64" }
  - tap: { id: tool-rect }
  - tap: { id: canvas, at: [80, 60] }
  - assert_text: { id: sk-count, key: status_count, args: { n: 3 } }

  # ---- Hit testing honors z: the overlap point selects the TOP shape ----
  - tap: { id: canvas, at: [90, 70] }
  - assert_text: { id: sk-sel, key: status_selected, args: { ids: "3" } }
  # Send it to the back; the same point now selects the shape underneath…
  - menu: { key: menu_back }
  - tap: { id: canvas, at: [90, 70] }
  - assert_text: { id: sk-sel, key: status_selected, args: { ids: "1" } }
  # …and one undo restores the stacking.
  - tap: { id: sk-undo }
  - tap: { id: canvas, at: [90, 70] }
  - assert_text: { id: sk-sel, key: status_selected, args: { ids: "3" } }

  # ---- Drag to move: live previews, ONE undo step ----
  - tap: { id: canvas, at: [248, 192] }
  - assert_text: { id: sk-sel, key: status_selected, args: { ids: "2" } }
  - drag: { id: canvas, from: [248, 192], to: [298, 242] }
  - assert_text: { id: sk-frame, text: "250,210 96x64" }
  # Undo lands on shape 3's placement — the selection THAT unit sealed with; the transient
  # switch to shape 2 is not history (docs/model.md "Transient UI state"). Re-select 2 to
  # check its restored frame.
  - tap: { id: sk-undo }
  - assert_text: { id: sk-sel, key: status_selected, args: { ids: "3" } }
  - tap: { id: canvas, at: [248, 192] }
  - assert_text: { id: sk-frame, text: "200,160 96x64" }

  # ---- Resize by the bottom-right handle: four fields, one undo step ----
  - drag: { id: canvas, from: [296, 224], to: [346, 274] }
  - assert_text: { id: sk-frame, text: "200,160 146x114" }
  - tap: { id: sk-undo }
  - assert_text: { id: sk-sel, key: status_selected, args: { ids: "3" } }
  - tap: { id: canvas, at: [248, 192] }
  - assert_text: { id: sk-frame, text: "200,160 96x64" }

  # ---- Group: multi-select via the toggle, then one unit each way ----
  - tap: { id: canvas, at: [45, 45] }
  - assert_text: { id: sk-sel, key: status_selected, args: { ids: "1" } }
  # Shift-tap adds to the selection (the desktop multi-select idiom; `modifiers:` stands the
  # held key in for this synthetic tap).
  - tap: { id: canvas, at: [90, 110], modifiers: [shift] }
  - assert_text: { id: sk-sel, key: status_selected, args: { ids: "1,3" } }
  - menu: { key: menu_group }
  - assert_text: { id: sk-count, key: status_count, args: { n: 4 } }
  - assert_text: { id: sk-sel, key: status_selected, args: { ids: "4" } }
  - assert_text: { id: sk-frame, text: "40,40 136x84" }

  # Dragging any member moves the WHOLE group, one undo step.
  - drag: { id: canvas, from: [50, 50], to: [60, 70] }
  - assert_text: { id: sk-frame, text: "50,60 136x84" }
  - tap: { id: sk-undo }
  - assert_text: { id: sk-frame, text: "40,40 136x84" }

  # Ungroup, undo it, redo it — each landing point brings its own selection back.
  - menu: { key: menu_ungroup }
  - assert_text: { id: sk-count, key: status_count, args: { n: 3 } }
  - assert_text: { id: sk-sel, key: status_selected, args: { ids: "1,3" } }
  - tap: { id: sk-undo }
  - assert_text: { id: sk-count, key: status_count, args: { n: 4 } }
  - assert_text: { id: sk-sel, key: status_selected, args: { ids: "4" } }
  - tap: { id: sk-redo }
  - assert_text: { id: sk-count, key: status_count, args: { n: 3 } }
  - assert_text: { id: sk-sel, key: status_selected, args: { ids: "1,3" } }

  # ---- Delete, and back ----
  - tap: { id: canvas, at: [248, 192] }
  - assert_text: { id: sk-sel, key: status_selected, args: { ids: "2" } }
  - menu: { key: menu_delete, path: [menu_edit] }
  - assert_text: { id: sk-count, key: status_count, args: { n: 2 } }
  - tap: { id: sk-undo }
  - assert_text: { id: sk-count, key: status_count, args: { n: 3 } }
  # …landing on the ungroup's point, whose selection was the two ungrouped shapes.
  - assert_text: { id: sk-sel, key: status_selected, args: { ids: "1,3" } }

  # ---- Edit ▸ Undo/Redo: the ROLE items drive the same document stack ----
  # (`day-undo`/`day-redo` are the core catalog keys role items are labeled by.)
  - tap: { id: tool-rect }
  - tap: { id: canvas, at: [340, 60] }
  - assert_text: { id: sk-count, key: status_count, args: { n: 4 } }
  - menu: { key: day-undo, path: [menu_edit] }
  - assert_text: { id: sk-count, key: status_count, args: { n: 3 } }
  # The undone delete left the timeline when the placement forked history, so this landing
  # point is the ungroup's — which brings the two ungrouped shapes' selection with it. The
  # redo then restores the placement's own selection, the new shape.
  - assert_text: { id: sk-sel, key: status_selected, args: { ids: "1,3" } }
  - menu: { key: day-redo, path: [menu_edit] }
  - assert_text: { id: sk-count, key: status_count, args: { n: 4 } }
  - assert_text: { id: sk-sel, key: status_selected, args: { ids: "4" } }
  - menu: { key: day-undo, path: [menu_edit] }
  - assert_text: { id: sk-count, key: status_count, args: { n: 3 } }

  # ---- Edit ▸ Cut/Copy/Paste: role items, SVG travelling the system clipboard ----
  - tap: { id: canvas, at: [45, 45] }
  - assert_text: { id: sk-sel, key: status_selected, args: { ids: "1" } }
  - menu: { key: day-copy, path: [menu_edit] }
  - menu: { key: day-paste, path: [menu_edit] }
  - assert_text: { id: sk-count, key: status_count, args: { n: 4 } }
  - assert_text: { id: sk-frame, text: "56,56 96x64" }
  - menu: { key: day-cut, path: [menu_edit] }
  - assert_text: { id: sk-count, key: status_count, args: { n: 3 } }
  - menu: { key: day-paste, path: [menu_edit] }
  - assert_text: { id: sk-count, key: status_count, args: { n: 4 } }
  - assert_text: { id: sk-frame, text: "72,72 96x64" }
  - menu: { key: day-undo, path: [menu_edit] }
  - assert_text: { id: sk-count, key: status_count, args: { n: 3 } }
  - assert_text: { id: sk-sel, key: status_none }

  # ---- Select All (the platform's own Edit item) + arrow-key nudging ----
  - menu: { key: day-select-all, path: [menu_edit] }
  - assert_text: { id: sk-sel, key: status_selected, args: { ids: "2,1,3" } }
  - tap: { id: canvas, at: [45, 45] }
  - assert_text: { id: sk-frame, text: "40,40 96x64" }
  - key: { key: ArrowRight }
  - assert_text: { id: sk-frame, text: "41,40 96x64" }
  - key: { key: ArrowDown, modifiers: [shift] }
  - assert_text: { id: sk-frame, text: "41,50 96x64" }
  - key: { key: ArrowLeft }
  - key: { key: ArrowUp, modifiers: [shift] }
  - assert_text: { id: sk-frame, text: "40,40 96x64" }

  # ---- Multi-select handles: every selected shape carries its own corners ----
  - tap: { id: canvas, at: [90, 70], modifiers: [shift] }
  - assert_text: { id: sk-sel, key: status_selected, args: { ids: "1,3" } }
  # Shape 3's bottom-right handle, dragged with BOTH selected: only shape 3 resizes.
  - drag: { id: canvas, from: [176, 124], to: [196, 144] }
  - tap: { id: canvas, at: [45, 45] }
  - assert_text: { id: sk-frame, text: "40,40 96x64" }
  - tap: { id: canvas, at: [90, 70] }
  - assert_text: { id: sk-frame, text: "80,60 116x84" }
  - tap: { id: sk-undo }

  # ---- Inspector: live geometry fields, multi-select editing (docs/inspector.md) ----
  # The single selection's live frame, field by field.
  - assert_text: { id: insp-x, text: "40" }
  - assert_text: { id: insp-y, text: "40" }
  - assert_text: { id: insp-w, text: "96" }
  - assert_text: { id: insp-h, text: "64" }
  # A typed value commits on submit and moves the shape — the status readout agrees…
  - input: { id: insp-x, text: "120" }
  - submit: { id: insp-x }
  - assert_text: { id: insp-x, text: "120" }
  - assert_text: { id: sk-frame, text: "120,40 96x64" }
  # …and one undo takes the whole edit back.
  - tap: { id: sk-undo }
  - assert_text: { id: insp-x, text: "40" }
  - assert_text: { id: sk-frame, text: "40,40 96x64" }
  # A canvas drag live-updates the fields (previews flow through the same bindings).
  - drag: { id: canvas, from: [45, 45], to: [65, 75] }
  - assert_text: { id: insp-x, text: "60" }
  - assert_text: { id: insp-y, text: "70" }
  - tap: { id: sk-undo }
  # Multi-select: widths agree, x positions differ — x reads empty behind its "multi"
  # placeholder, and typing into it aligns EVERY selected shape in one undo step.
  - tap: { id: canvas, at: [90, 70], modifiers: [shift] }
  - assert_text: { id: sk-sel, key: status_selected, args: { ids: "1,3" } }
  - assert_text: { id: insp-x, text: "" }
  - assert_text: { id: insp-w, text: "96" }
  - input: { id: insp-x, text: "40" }
  - submit: { id: insp-x }
  - assert_text: { id: insp-x, text: "40" }
  # Undo lands on the last nudge — shape 1 alone — so the field shows its value, not "multi":
  # the shift-tap that widened the selection was transient, and is not history.
  - tap: { id: sk-undo }
  - assert_text: { id: sk-sel, key: status_selected, args: { ids: "1" } }
  - assert_text: { id: insp-x, text: "40" }

  # ---- Style: opacity as a slider + localized percent field, width as a stepper field ----
  # (Color wells are exercised by unit tests and the screenshots — a native chooser has no
  # headless rail to drive.)
  - assert_text: { id: insp-fill-op, key: insp_percent, args: { pct: 100 } }
  - input: { id: insp-fill-op, text: "40%" }
  - submit: { id: insp-fill-op }
  - assert_text: { id: insp-fill-op, key: insp_percent, args: { pct: 40 } }
  - input: { id: insp-stroke-w, text: "6" }
  - submit: { id: insp-stroke-w }
  - assert_text: { id: insp-stroke-w, text: "6" }
  # Each style commit is one undo unit, selection riding along as ever.
  - tap: { id: sk-undo }
  - assert_text: { id: insp-stroke-w, text: "1" }
  - tap: { id: sk-undo }
  - assert_text: { id: insp-fill-op, key: insp_percent, args: { pct: 100 } }
  - assert_text: { id: sk-sel, key: status_selected, args: { ids: "1" } }

  # ---- Zoom: menu-driven, center-anchored; in and out are exact inverses ----
  - assert_text: { id: sk-zoom, key: status_zoom, args: { pct: 100 } }
  - menu: { key: menu_zoom_in, path: [menu_view] }
  - assert_text: { id: sk-zoom, key: status_zoom, args: { pct: 125 } }
  - menu: { key: menu_zoom_in, path: [menu_view] }
  - assert_text: { id: sk-zoom, key: status_zoom, args: { pct: 156 } }
  # The transform is VIEW-only: model geometry (and the inspector reading it) is untouched.
  - assert_text: { id: sk-frame, text: "40,40 96x64" }
  - assert_text: { id: insp-x, text: "40" }
  - menu: { key: menu_zoom_out, path: [menu_view] }
  - assert_text: { id: sk-zoom, key: status_zoom, args: { pct: 125 } }
  - menu: { key: menu_zoom_reset, path: [menu_view] }
  - assert_text: { id: sk-zoom, key: status_zoom, args: { pct: 100 } }
  # Back at identity (reset cancels the panning the anchored steps introduced), canvas
  # points mean model points again: a blank click clears the selection…
  - tap: { id: canvas, at: [600, 400] }
  - assert_text: { id: sk-sel, key: status_none }
  # …and re-selecting gives the parting shot its handles.
  - tap: { id: canvas, at: [45, 45] }
  - assert_text: { id: sk-sel, key: status_selected, args: { ids: "1" } }
  # Close the panel so the parting shot is the same canvas on every target — and give the
  # mobile sheet its dismiss transition, or the capture races it and catches a sliver.
  - tap: { id: tool-inspector }
  - pause: 1

  - screenshot:
      name: editor
      title: { en: "Editor" }
      source: src/canvas.rs
