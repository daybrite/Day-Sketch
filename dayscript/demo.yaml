  - screenshot:
      name: translucency
      title: { en: "Three circles, half seen" }
      caption: { en: "Overlapping ovals at 50% fill: where two meet the colors mix, where all three do they mix again." }
      source: src/canvas.rs

  # ---- Outlines: the same shapes with their fill taken away ----
  - menu: { key: menu_new }
  - menu: { key: menu_inspector }
  - wait_for: { id: insp_bg }
  - menu: { key: tool_rect, path: [menu_insert] }
  - input: { id: insp_x, text: "40" }
  - submit: { id: insp_x }
  - input: { id: insp_y, text: "80" }
  - submit: { id: insp_y }
  - input: { id: insp_w, text: "180" }
  - submit: { id: insp_w }
  - input: { id: insp_h, text: "180" }
  - submit: { id: insp_h }
  - menu: { key: tool_oval, path: [menu_insert] }
  - input: { id: insp_x, text: "110" }
  - submit: { id: insp_x }
  - input: { id: insp_y, text: "150" }
  - submit: { id: insp_y }
  - input: { id: insp_w, text: "180" }
  - submit: { id: insp_w }
  - input: { id: insp_h, text: "180" }
  - submit: { id: insp_h }
  - menu: { key: tool_rect, path: [menu_insert] }
  - input: { id: insp_x, text: "75" }
  - submit: { id: insp_x }
  - input: { id: insp_y, text: "115" }
  - submit: { id: insp_y }
  - input: { id: insp_w, text: "180" }
  - submit: { id: insp_w }
  - input: { id: insp_h, text: "180" }
  - submit: { id: insp_h }
  - input: { id: insp_rotation, text: "45" }
  - submit: { id: insp_rotation }
  # No fill at all, and a stroke heavy enough to carry the drawing on its own.
