  - submit: { id: insp_h }
  - menu: { key: tool_oval, path: [menu_insert] }
  - input: { id: insp_x, text: "130" }
  - submit: { id: insp_x }
  - input: { id: insp_y, text: "90" }
  - submit: { id: insp_y }
  - input: { id: insp_w, text: "150" }
  - submit: { id: insp_w }
  - input: { id: insp_h, text: "150" }
  - submit: { id: insp_h }
  - menu: { key: tool_oval, path: [menu_insert] }
  - input: { id: insp_x, text: "85" }
  - submit: { id: insp_x }
  - input: { id: insp_y, text: "170" }
  - submit: { id: insp_y }
