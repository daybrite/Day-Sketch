name: ci

on:
  push:
    branches: ["**"]
    tags: ["v[0-9]+.[0-9]+.[0-9]+*"]
  workflow_dispatch:
  schedule:
    - cron: "0 11 * * *" # daily (UTC)

permissions:
  contents: write # release-asset upload on tag builds
  pages: write    # web-dom → GitHub Pages (deploy-web)
  id-token: write # deploy-pages OIDC token (deploy-web)

jobs:
  app:
    uses: daybrite/actions/.github/workflows/build-day-app.yml@main
    secrets: inherit
    with:
      targets: windows-xaml, macos-appkit, linux-gtk, linux-qt, ios-uikit, android-mdc, harmony-arkui, web-dom
      day-version: main
      scripts: dayscript/demo.yaml
      #launch-env: WEATHER_MOCK=1
      locales: en
      # Two form factors per phone platform, each its own parallel job, its own screenshot
      # artifact and its own column in the published gallery. A drawing app is a different
      # program on a tablet — the layers pane and the inspector tile beside the canvas at that
      # width instead of covering it — so a phone capture alone shows half of what ships.
      #
      # `device` is a name PREFIX on iOS (runner images retire exact device names, and a pinned
      # one starts failing the day the image moves) and an exact `avdmanager list device` id on
      # Android. The first profile stays primary: it packs, and keeps the plain
      # screenshots-<target> artifact; the second uploads screenshots-<target>-<slug>.
      ios-devices: |
        device=iPhone,           orientation=portrait
        device=iPad Pro 13-inch, orientation=landscape, slug=ipad
      android-devices: |
        device=pixel_5,      os=36, orientation=portrait
        device=pixel_tablet, os=36, orientation=landscape, slug=tablet
      deploy-web: true
      daysite-version: main

